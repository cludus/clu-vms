variant: flatcar
version: 1.0.0
passwd:
  users:
    - name: core
      ssh_authorized_keys:
        - ssh-rsa  gilberto.vento@gmail.com
storage:
  files:
    - path: /etc/systemd/network/static.network
      contents:
        inline: |
          [Match]
          Name=eth0

          [Network]
          Address=10.146.101.15/24
          Gateway=10.146.101.1
          DNS=1.1.1.1
          DNS=8.8.8.8
  filesystems:
    - device: /dev/vdb
      format: ext4
      path: /var/lib/docker
      with_mount_unit: true
systemd:
  units:
    - name: docker.service
      enabled: true
    - name: portainer.service
      enabled: true
      contents: |
        [Unit]
        Description=Portainer
        After=docker.service
        Requires=docker.service

        [Service]
        TimeoutStartSec=0
        ExecStartPre=-/usr/bin/docker kill portainer
        ExecStartPre=-/usr/bin/docker rm portainer
        ExecStartPre=/usr/bin/docker pull portainer/portainer-ce:latest
        ExecStart =/usr/bin/docker run --name portainer -p 9000:9000 -v /var/run/docker.sock:/var/run/docker.sock -v portainer_data:/data portainer/portainer-ce:latest
        ExecStop=/usr/bin/docker stop portainer

        [Install]
        WantedBy=multi-user.target